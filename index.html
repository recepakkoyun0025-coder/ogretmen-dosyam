<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Öğretmen Dosyam</title>
<meta name="theme-color" content="#C2362E">
<meta name="description" content="Türkçe öğretmeni dosyası: sınıf listeleri, çizelgeler, tutanaklar, dosyalar, mevzuat.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}

/* Düzen: masaüstünde sol kenar çubuğu + içerik; telefonda üst başlık + alt sekme çubuğu. Kırmızı kalem vurgusu, kareli defter dokusu. */
:root{
  --paper:#F4F6F9; --surface:#FFFFFF; --sunk:#ECEFF4; --ink:#15203A; --muted:#58637A; --line:#DCE1EA; --line2:#B8C0CE;
  --red:#C2362E; --red-soft:#FBE8E6; --blue:#244B8C; --blue-soft:#E6EDF8; --ok:#2C7649; --ok-soft:#E2F1E8; --warn:#9E6410; --warn-soft:#FAEFD9;
  --grid:rgba(36,75,140,.07);
  --f-disp:"Bitter",Georgia,"Times New Roman",serif; --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0E131C; --surface:#161D29; --sunk:#111722; --ink:#E4E8F0; --muted:#98A2B6; --line:#263145; --line2:#3A4760;
  --red:#EF6D62; --red-soft:#3A1F1D; --blue:#89AAE6; --blue-soft:#1A2741; --ok:#6CC494; --ok-soft:#163325; --warn:#E2AB55; --warn-soft:#382A13;
  --grid:rgba(137,170,230,.06); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --paper:#0E131C; --surface:#161D29; --sunk:#111722; --ink:#E4E8F0; --muted:#98A2B6; --line:#263145; --line2:#3A4760;
  --red:#EF6D62; --red-soft:#3A1F1D; --blue:#89AAE6; --blue-soft:#1A2741; --ok:#6CC494; --ok-soft:#163325; --warn:#E2AB55; --warn-soft:#382A13;
  --grid:rgba(137,170,230,.06); color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.aihl{background:var(--warn-soft)!important;border-color:var(--warn)!important}
.board{text-align:center;font-size:12px;letter-spacing:.08em;font-weight:600;color:var(--muted);border:1.5px solid var(--line2);border-radius:6px;padding:8px;margin-bottom:16px;background:var(--sunk)}
.desks{display:grid;gap:14px 18px;min-width:max-content}
.desk{display:flex;gap:4px;padding:5px;border-radius:8px;background:var(--sunk);border:1px solid var(--line)}
.seat{flex:1;min-width:76px;min-height:56px;border:1px dashed var(--line2);border-radius:6px;background:var(--surface);cursor:pointer;font-size:12.5px;line-height:1.25;padding:5px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);text-align:center}
.seat .num{font-size:11px;color:var(--muted)}
.seat.on{border-style:solid;border-color:var(--blue)}
.seat.kiz{border-color:var(--red)}
.seat.erkek{border-color:var(--blue)}
.seat.sel{box-shadow:0 0 0 2px var(--warn)}
.tabbar button span{font-size:10px}
body.setup .tabbar,body.setup .side .navlink,body.setup .topbar .btn{display:none}
html,body{min-height:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--surface)}
h1,h2,h3{font-family:var(--f-disp);text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:clamp(24px,4.2vw,34px);font-weight:700}
h2{font-size:21px;font-weight:600}
h3{font-size:16px;font-weight:600}
p{margin:0}
a{color:var(--blue)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Kabuk */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:20px 14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand-mark{width:36px;height:36px;border-radius:8px;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--f-disp);font-weight:700;font-size:17px;flex:none}
.brand b{font-family:var(--f-disp);font-size:17px;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:12px}
.navlink{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;border:0;background:none;text-align:left;cursor:pointer;color:var(--ink);font-weight:500;width:100%}
.navlink svg{width:19px;height:19px;flex:none;color:var(--muted)}
.navlink:hover{background:var(--sunk)}
.navlink[aria-current="page"]{background:var(--blue-soft);color:var(--blue)}
.navlink[aria-current="page"] svg{color:var(--blue)}
.side .spacer{flex:1}
.syncbox{font-size:12px;color:var(--muted);padding:10px;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:none}
.dot.ok{background:var(--ok)}.dot.busy{background:var(--warn)}.dot.err{background:var(--red)}

.topbar{display:none;position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));align-items:center;gap:10px}
.topbar .brand{padding:0;flex:1;min-width:0}
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(6px,env(safe-area-inset-left,0px));padding-right:max(6px,env(safe-area-inset-right,0px))}
.tabbar button{flex:1;min-width:0;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);padding:4px 0;cursor:pointer}
.tabbar svg{width:21px;height:21px}
.tabbar button[aria-current="page"]{color:var(--red)}
main{min-width:0;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
@media (max-width:899px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .topbar{display:flex}
  .tabbar{display:flex}
  main{padding-block:18px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* Bileşenler */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:8px 13px;cursor:pointer;font-weight:500;font-size:14px;line-height:1.2;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn svg{width:17px;height:17px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:var(--surface)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--sunk)}
.btn.danger{color:var(--red);border-color:var(--red-soft)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.card h2,.card h3{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pagehead p{color:var(--muted);margin-top:4px;max-width:62ch}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{font-family:var(--f-mono);font-size:11px;opacity:.7;margin-left:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;border-radius:999px;padding:2px 9px;background:var(--sunk);color:var(--muted);font-weight:500}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.red{background:var(--red-soft);color:var(--red)}
.pill.blue{background:var(--blue-soft);color:var(--blue)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.inp{border:1px solid var(--line2);background:var(--surface);border-radius:8px;padding:9px 11px;width:100%;min-width:0}
textarea.inp{min-height:150px;resize:vertical;font-family:var(--f-mono);font-size:13px;line-height:1.55}
.fgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.empty{border:1.5px dashed var(--line2);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-family:var(--f-disp);font-size:17px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);min-width:0;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li:hover{background:var(--sunk)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .t small{color:var(--muted)}
.search{position:relative;flex:1;min-width:180px;max-width:360px}
.search input{padding-left:34px}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}

/* Pano */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;position:relative;overflow:hidden;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:22px 22px}
.hero::after{content:"";position:absolute;left:52px;top:0;bottom:0;width:1.5px;background:var(--red);opacity:.35}
.hero > *{position:relative;padding-left:44px}
.hero h1{margin:6px 0 6px}
.hero .meta{color:var(--muted);max-width:70ch}
.hero .row{margin-top:16px}
@media (max-width:599px){.hero{padding:18px}.hero::after{left:26px}.hero > *{padding-left:22px}}
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
@media (max-width:699px){.stats{gap:6px}.stat{padding:9px 8px}.stat b{font-size:19px}.stat span{font-size:11px}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer;text-align:left}
.stat:hover{border-color:var(--line2)}
.stat b{font-family:var(--f-mono);font-size:24px;display:block;line-height:1.1}
.stat span{font-size:12.5px;color:var(--muted)}
.ev{display:grid;grid-template-columns:58px 1fr;gap:12px;padding:9px 0;border-bottom:1px solid var(--line);align-items:center}
.ev:last-child{border-bottom:0}
.ev .d{font-family:var(--f-mono);text-align:center;border:1px solid var(--line);border-radius:7px;padding:3px 0;line-height:1.15}
.ev .d b{display:block;font-size:18px}
.ev .d small{font-size:10.5px;text-transform:uppercase;color:var(--muted)}
.ev.milli .d{border-color:var(--red);color:var(--red)}
.ev.tatil .d{border-color:var(--ok);color:var(--ok)}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.box{width:20px;height:20px;border-radius:5px;border:1.5px solid var(--line2);flex:none;display:grid;place-items:center;margin-top:1px;font-size:13px}
.box.on{background:var(--ok);border-color:var(--ok);color:#fff}
.meter{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.meter i{display:block;height:100%;background:var(--ok);border-radius:99px}

/* Kartlar: şablon, sınıf */
.tpl{display:flex;flex-direction:column;gap:6px;text-align:left;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tpl:hover{border-color:var(--ink)}
.tpl b{font-family:var(--f-disp);font-weight:600;font-size:15.5px}
.tpl small{color:var(--muted);font-size:13px;line-height:1.4}
.tpl .cols{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tpl[aria-pressed="true"]{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}

/* Tablo (öğrenci, çizelge) */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-width:100%}
table.t{border-collapse:separate;border-spacing:0;width:100%;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center;white-space:nowrap}
table.t th{background:var(--sunk);font-weight:600;font-size:12.5px;padding:8px 8px;position:sticky;top:0;z-index:2}
table.t tr:last-child td{border-bottom:0}
table.t .sticky{position:sticky;left:0;z-index:1;background:var(--surface);text-align:left}
table.t th.sticky{z-index:3;background:var(--sunk)}
table.t td.nm{padding:7px 10px;min-width:170px;max-width:240px;overflow:hidden;text-overflow:ellipsis}
table.t td.no{font-family:var(--f-mono);color:var(--muted);padding:7px 8px;font-size:13px}
table.t td.cy{cursor:pointer;min-width:46px;height:38px;font-size:17px;user-select:none;-webkit-user-select:none}
table.t td.cy:hover{background:var(--sunk)}
table.t td.cy.v{color:var(--ok);font-weight:700}
table.t td.cy.x{color:var(--red);font-weight:700}
table.t td.cy.y{color:var(--warn);font-weight:700}
table.t td.cy.o1{background:var(--red-soft);color:var(--red);font-family:var(--f-mono);font-size:15px}
table.t td.cy.o2{background:var(--warn-soft);color:var(--warn);font-family:var(--f-mono);font-size:15px}
table.t td.cy.o3{background:var(--blue-soft);color:var(--blue);font-family:var(--f-mono);font-size:15px}
table.t td.cy.o4{background:var(--ok-soft);color:var(--ok);font-family:var(--f-mono);font-size:15px}
table.t td input{border:0;background:transparent;width:100%;min-width:64px;padding:8px 6px;text-align:center;font-family:var(--f-mono)}
table.t td input.txt{font-family:var(--f-body);text-align:left;min-width:150px}
table.t td input:focus{background:var(--blue-soft);outline:none}
table.t td.sum{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);padding:6px 10px;background:var(--sunk)}
table.t tfoot td{background:var(--sunk);font-family:var(--f-mono);font-size:12px;color:var(--muted);padding:6px;border-top:1px solid var(--line2)}
table.t th.colh{cursor:pointer;min-width:52px;max-width:150px;white-space:normal;line-height:1.25}
table.t th.colh:hover{color:var(--blue)}
table.t th .tp{display:block;font-weight:400;font-size:10.5px;color:var(--muted);font-family:var(--f-mono)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span b{font-family:var(--f-mono)}
.ogr td{padding:0}
.ogr td input{border:0;background:transparent;padding:8px 10px;width:100%;min-width:0}
.ogr td input:focus{background:var(--blue-soft);outline:none}
.ogr td.del{width:40px}

/* Belge düzenleyici */
.toolbar{display:flex;gap:4px;flex-wrap:wrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:6px 0}
@media (max-width:899px){.toolbar{top:calc(env(safe-area-inset-top,0px) + 57px)}}
.toolbar .btn{padding:6px 9px}
.sheet{background:#fff;color:#111;border:1px solid var(--line);border-radius:4px;padding:clamp(18px,5vw,56px);max-width:860px;width:100%;margin:0 auto;min-height:60vh;font-family:"Times New Roman",Georgia,serif;font-size:16px;line-height:1.5;box-shadow:0 1px 0 var(--line)}
.sheet:focus{outline:none;box-shadow:0 0 0 2px var(--blue)}
.sheet h2{font-family:"Times New Roman",Georgia,serif;font-size:17px;font-weight:700;margin:10px 0}
.sheet h3{font-family:"Times New Roman",Georgia,serif;font-size:16px;font-weight:700;margin:14px 0 6px}
.sheet p{margin:6px 0}
.sheet table{border-collapse:collapse;width:100%;margin:8px 0}
.sheet td,.sheet th{border:1px solid #333;padding:5px 7px;vertical-align:top;text-align:left}
.sheet table.imza td{border:none;text-align:center;padding-top:28px}
.sheet ol,.sheet ul{padding-left:24px;margin:6px 0}
.docview{overflow-x:auto}

/* Dosyalar */
.files{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr))}
.fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;text-align:left;padding:0;display:flex;flex-direction:column;min-width:0}
.fcard:hover{border-color:var(--ink)}
.fthumb{aspect-ratio:4/3;max-width:100%;background:var(--sunk);display:grid;place-items:center;overflow:hidden}
.fthumb img{width:100%;height:100%;object-fit:cover}
.ext{font-family:var(--f-mono);font-weight:500;font-size:14px;padding:8px 10px;border-radius:6px;background:var(--surface);border:1px solid var(--line2);text-transform:uppercase}
.ext.pdf{color:var(--red);border-color:var(--red)}
.ext.doc{color:var(--blue);border-color:var(--blue)}
.ext.xls{color:var(--ok);border-color:var(--ok)}
.fmeta{padding:9px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.fmeta b{font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fmeta small{font-size:12px;color:var(--muted)}
.flayout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:799px){.flayout{grid-template-columns:minmax(0,1fr)}}
.folders{display:flex;flex-direction:column;gap:2px}
@media (max-width:799px){.folders{flex-direction:row;overflow-x:auto;padding-bottom:4px}.folders .navlink{white-space:nowrap;width:auto}}
.navlink .n{margin-left:auto;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.preview{max-height:62vh;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--sunk);padding:10px}
.preview img,.preview video{max-width:100%;display:block;margin:0 auto;border-radius:6px}
.preview table{border-collapse:collapse;font-size:13px;background:var(--surface)}
.preview td{border:1px solid var(--line);padding:3px 6px}
.preview .docx{background:#fff;color:#111;padding:20px;font-family:"Times New Roman",serif}
.uprow{display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
@media (max-width:599px){.uprow{grid-template-columns:minmax(0,1fr)}}
.uprow .st{font-size:12px;color:var(--muted)}

/* Mevzuat */
.law{border-bottom:1px solid var(--line);padding:14px 0;display:flex;flex-direction:column;gap:6px}
.law:last-child{border-bottom:0}
.law .hd{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.law .hd b{font-family:var(--f-disp);font-size:16.5px;font-weight:600}
.law ul{margin:2px 0 0;padding-left:20px;color:var(--ink)}
.law li{margin:2px 0}
.mars{column-width:280px;column-gap:36px;font-family:var(--f-disp);font-size:16px;line-height:1.65}
.mars p{break-inside:avoid;margin:0 0 16px}
.mars p::before{content:attr(data-k);display:block;font-family:var(--f-mono);font-size:11px;color:var(--red);letter-spacing:.06em}
.hitabe{font-family:var(--f-disp);font-size:16px;line-height:1.7;max-width:70ch;display:flex;flex-direction:column;gap:12px}
.themes{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));counter-reset:th}
.themes div{border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);font-weight:500}
.themes div small{display:block;font-family:var(--f-mono);color:var(--red);font-size:11px}

/* Müfettiş dosyası */
.dossier{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.cover{padding:28px 24px;border-bottom:1px solid var(--line);text-align:center;display:flex;flex-direction:column;gap:6px;align-items:center}
.cover .tc{font-family:var(--f-disp);font-weight:700;letter-spacing:.04em;font-size:14px}
.cover h1{font-size:clamp(24px,4vw,32px);margin:10px 0 4px}
.toc{padding:8px 20px 20px}
.toc section{padding:14px 0;border-bottom:1px solid var(--line)}
.toc section:last-child{border-bottom:0}
.toc h3{display:flex;gap:10px;align-items:baseline;margin-bottom:6px}
.toc h3 .k{font-family:var(--f-mono);color:var(--red);font-size:13px}
.toc .items{display:flex;flex-direction:column}
.toc .items button{background:none;border:0;text-align:left;padding:6px 0 6px 28px;cursor:pointer;color:var(--ink);display:flex;justify-content:space-between;gap:10px;border-bottom:1px dotted var(--line)}
.toc .items button:hover{color:var(--blue)}
.toc .items button small{color:var(--muted);white-space:nowrap}

/* Modal ve bildirim */
.modal{position:fixed;inset:0;z-index:60;background:rgba(10,14,22,.5);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dialog{background:var(--surface);border-radius:12px;width:min(720px,100%);max-height:100%;display:flex;flex-direction:column;border:1px solid var(--line);min-width:0}
.dialog.wide{width:min(980px,100%)}
.dlg-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.dlg-b{padding:18px;overflow:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.dlg-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:9px;font-size:14px;max-width:min(92vw,520px);box-shadow:0 6px 20px rgba(0,0,0,.18)}
@media (min-width:900px){.toast{bottom:28px}}
.banner{border:1px solid var(--warn);background:var(--warn-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:14px}
.note{font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.dialog{animation:pop .16s ease-out}@keyframes pop{from{transform:translateY(6px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side"></aside>
  <div style="min-width:0">
    <header class="topbar" id="topbar"></header>
    <main id="view"><div class="wrap"><div class="empty"><b>Öğretmen Dosyam açılıyor…</b></div></div></main>
  </div>
</div>
<nav class="tabbar" id="tabbar" aria-label="Bölümler"></nav>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>
<script src="vendor/xlsx.full.min.js"></script>
<script src="vendor/mammoth.browser.min.js"></script>
<script src="app.js"></script>
</body>
</html>
